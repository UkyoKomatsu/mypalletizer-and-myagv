# Use the ros2-lan Docker context (native Docker Engine in mirrored WSL Ubuntu).
# ROS peers on the same LAN and ROS_DOMAIN_ID are discovered by multicast.
services:
  ros2_galactic:
    image: docker-ros2_galactic
    build: .
    container_name: ros2_galactic
    init: true
    entrypoint: ["/bin/bash", "/opt/ros-network/container-entrypoint.sh"]
    command: ["bash"]
    network_mode: host
    environment:
      DISPLAY: ${DISPLAY:-}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_DOMAIN_ID: "0"
      ROS_LOCALHOST_ONLY: "0"
      CYCLONEDDS_URI: file:///run/ros-network/cyclonedds.xml
      ROS_BUILD_ON_START: ${ROS_BUILD_ON_START:-0}
      ROS_NETWORK_INTERFACE: ${ROS_NETWORK_INTERFACE:-}
    stdin_open: true
    tty: true
    restart: "no"
    privileged: true
    volumes:
      - ${ROS_HOST_ROOT:-/mnt/c/Users/siron}/mypalletizer-and-myagv/Docker/network:/opt/ros-network:ro
      - ${ROS_HOST_ROOT:-/mnt/c/Users/siron}/mypalletizer-and-myagv/Docker/entrypoint.sh:/entrypoint.sh:ro
      - ${ROS_HOST_ROOT:-/mnt/c/Users/siron}/git:/root/git
      - ${ROS_HOST_ROOT:-/mnt/c/Users/siron}/.gitconfig:/root/.gitconfig
      - ${ROS_HOST_ROOT:-/mnt/c/Users/siron}/.ssh:/root/.ssh
      - ${ROS_HOST_ROOT:-/mnt/c/Users/siron}/btr2026_colcon_ws:/root/colcon_ws
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
